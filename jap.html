<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>JLPT N5 Practice Papers</title>
<style>
:root{--bg:#fbfaf7;--card:#fff;--ink:#1d1d1f;--mute:#6b6b70;--line:#dcd9d2;--accent:#b3332f;--ok:#1f7a4d;--okbg:#e4f4ea;--bad:#b3261e;--badbg:#fbe6e4;--sel:#e9eefb;--selline:#3a5bd0}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#17171a;--card:#212125;--ink:#ececee;--mute:#9a9aa2;--line:#3a3a40;--accent:#ff7a73;--ok:#6fd3a0;--okbg:#17352a;--bad:#ff8a82;--badbg:#3b1d1b;--sel:#232c4a;--selline:#8aa4ff}}
:root[data-theme=dark]{--bg:#17171a;--card:#212125;--ink:#ececee;--mute:#9a9aa2;--line:#3a3a40;--accent:#ff7a73;--ok:#6fd3a0;--okbg:#17352a;--bad:#ff8a82;--badbg:#3b1d1b;--sel:#232c4a;--selline:#8aa4ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",system-ui,sans-serif;line-height:1.7}
.wrap{max-width:860px;margin:0 auto;padding:0 16px 80px}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 16px}
header.top .in{max-width:860px;margin:0 auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
header.top h1{font-size:17px;margin:0;flex:1;min-width:150px}
button,.btn{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:5px 12px;border-radius:8px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
h2{font-size:22px;margin:24px 0 4px}
.sub{color:var(--mute);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;margin:12px 0 22px}
.card{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px 14px;text-decoration:none;color:inherit;display:block}
.card b{display:block}
.card.pending{opacity:.5;cursor:default}
.card small{color:var(--mute)}
.sec{margin-top:26px}
.sec>h3{font-size:18px;border-bottom:2px solid var(--ink);padding-bottom:4px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.sec>h3 .t{font-weight:400;font-size:14px;color:var(--mute)}
.head{font-weight:700;margin:20px 0 6px;white-space:pre-line;background:var(--card);border-left:4px solid var(--accent);padding:6px 10px}
.passage{border:1.5px solid var(--ink);padding:10px 14px;margin:10px 0;line-height:2.3;border-radius:4px;background:var(--card)}
table.info{border-collapse:collapse;margin:8px auto;text-align:center}
table.info td,table.info th{border:1px solid var(--ink);padding:3px 14px}
.item{margin:12px 0 16px;padding:8px 10px;border-radius:8px;border:1px solid transparent}
.item.ok{background:var(--okbg);border-color:var(--ok)}
.item.bad{background:var(--badbg);border-color:var(--bad)}
.stem{display:flex;gap:8px;align-items:baseline;line-height:2.1;white-space:pre-line}
.num{display:inline-block;border:1.5px solid var(--ink);min-width:24px;text-align:center;font-weight:700;line-height:1.4;padding:0 4px;flex:none}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;margin:2px 0 0 32px}
.opts.wide{grid-template-columns:1fr}
@media (max-width:560px){.opts{grid-template-columns:1fr}}
.opt{text-align:left;padding:2px 10px;border:1px solid var(--line);background:var(--card);border-radius:8px;line-height:2}
.opt.sel{background:var(--sel);border-color:var(--selline)}
.opt.right{background:var(--okbg);border-color:var(--ok);font-weight:700}
.opt.wrong{background:var(--badbg);border-color:var(--bad);text-decoration:line-through}
.opt .n{display:inline-block;width:1.6em;color:var(--mute)}
.blank{display:inline-block;min-width:62px;border-bottom:1.5px solid var(--ink);text-align:center;margin:0 3px;height:1.2em;vertical-align:bottom}
.exp{margin:6px 0 0 32px;font-size:14px;line-height:1.7;color:var(--ink);border-top:1px dashed var(--line);padding-top:4px}
.exp .ans{font-weight:700;color:var(--ok)}
.script{margin:6px 0 0 32px;font-size:14px;white-space:pre-line;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.play{margin-left:32px;margin-top:2px}
.score{position:sticky;bottom:0;background:var(--card);border:1px solid var(--line);border-radius:12px 12px 0 0;padding:8px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:24px}
.score .s{flex:1;min-width:180px;font-size:14px}
ruby rt{font-size:.55em;color:var(--mute)}
body.nofuri ruby rt{display:none}
.timer{font-variant-numeric:tabular-nums;font-size:14px;color:var(--mute)}
.note{font-size:13px;color:var(--mute)}
</style></head><body>
<header class="top"><div class="in">
<h1><a href="#" style="color:inherit;text-decoration:none">JLPT N5 Practice Papers</a></h1>
<button id="furi">Furigana: on</button><button id="theme">Theme</button>
</div></header>
<div class="wrap" id="app"></div>
<script>
const DATA = { "papers": [{ "id": "mock01", "title": "JLPT N5 Mock Paper 01", "kind": "mock", "subtitle": "Full-length practice paper (original questions)", "filename": "N5_Mock_Paper_01", "sections": [{ "name": "言語知識（文字・語彙）", "type": "vocab", "minutes": 25, "parts": [{ "heading": "もんだい1　＿＿＿の ことばは どう よみますか。\n1・2・3・4から いちばん いい ものを ひとつ えらんで ください。", "items": [{ "stem": "<u>今日</u>は あついですね。", "choices": ["きよう", "きょう", "きょお", "ぎょう"], "answer": 2, "explain": "今日 = きょう (today)." }, { "stem": "<u>来月</u>、くにへ かえります。", "choices": ["らいがつ", "らいけつ", "らいげっ", "らいげつ"], "answer": 4, "explain": "来月 = らいげつ (next month); 月 is げつ here, not がつ." }, { "stem": "<u>火</u>を けして ください。", "choices": ["ひ", "び", "か", "ひい"], "answer": 1, "explain": "火 = ひ (fire)." }, { "stem": "つめたい <u>水</u>を ください。", "choices": ["みす", "みづ", "みず", "すい"], "answer": 3, "explain": "水 = みず (water)." }, { "stem": "にわに <u>木</u>が あります。", "choices": ["ぎ", "もく", "き", "きい"], "answer": 3, "explain": "木 = き (tree)." }, { "stem": "<u>お金</u>が ありません。", "choices": ["おかね", "おがね", "おかん", "おきん"], "answer": 1, "explain": "お金 = おかね (money); 金 reads かね with no dakuten." }, { "stem": "<u>土曜日</u>に かいものを します。", "choices": ["とようび", "どうようび", "どようひ", "どようび"], "answer": 4, "explain": "土曜日 = どようび (Saturday)." }, { "stem": "<u>日曜日</u>は やすみです。", "choices": ["にちよび", "にちようび", "にっようび", "じつようび"], "answer": 2, "explain": "日曜日 = にちようび (Sunday); note the long よう." }, { "stem": "<u>来週</u>の げつようびに あいましょう。", "choices": ["らいしゅう", "らいじゅう", "らいしゅ", "れいしゅう"], "answer": 1, "explain": "来週 = らいしゅう (next week)." }, { "stem": "<u>今年</u>、にほんへ いきます。", "choices": ["きょねん", "ことじ", "ごとし", "ことし"], "answer": 4, "explain": "今年 = ことし (this year); きょねん is 'last year'." }, { "stem": "いま <u>三時</u>です。", "choices": ["さんし", "さんじ", "さんぢ", "さんとき"], "answer": 2, "explain": "三時 = さんじ (three o'clock); 時 is じ in clock times." }, { "stem": "<u>五分</u> まって ください。", "choices": ["ごぶん", "こふん", "ごふん", "ごうふん"], "answer": 3, "explain": "五分 = ごふん (five minutes)." }] }, { "heading": "もんだい2　＿＿＿の ことばは どう かきますか。\n1・2・3・4から いちばん いい ものを ひとつ えらんで ください。", "items": [{ "stem": "りんごを <u>はんぶん</u> たべました。", "choices": ["半月", "半分", "半日", "半時"], "answer": 2, "explain": "はんぶん = 半分 (half). The others are different words." }, { "stem": "<u>こんげつ</u>は いそがしいです。", "choices": ["今日", "今週", "今月", "今年"], "answer": 3, "explain": "こんげつ = 今月 (this month)." }, { "stem": "<u>まいにち</u> にほんごを べんきょうします。", "choices": ["毎日", "母日", "毎月", "毎年"], "answer": 1, "explain": "まいにち = 毎日 (every day); 毎月 is まいつき, 毎年 is まいとし." }, { "stem": "きょうしつに <u>なんにん</u> いますか。", "choices": ["人何", "何大", "何本", "何人"], "answer": 4, "explain": "なんにん = 何人 (how many people); 何本 is なんぼん (long objects)." }, { "stem": "<u>ごぜん</u> くじに おきます。", "choices": ["午後", "午前", "後前", "先午"], "answer": 2, "explain": "ごぜん = 午前 (a.m.); 午後 is ごご (p.m.)." }, { "stem": "ごはんの <u>あと</u>で テレビを みます。", "choices": ["後", "先", "前", "今"], "answer": 1, "explain": "あと = 後 (after). 先 is さき, 前 is まえ, 今 is いま." }, { "stem": "<u>せんしゅう</u> ともだちに あいました。", "choices": ["今週", "毎週", "先週", "来週"], "answer": 3, "explain": "せんしゅう = 先週 (last week)." }, { "stem": "いえで <u>てれび</u>を みます。", "choices": ["テレピ", "チレビ", "テレヒ", "テレビ"], "answer": 4, "explain": "てれび = テレビ (TV): テ, レ, ビ with dakuten (not ピ or ヒ)." }] }, { "heading": "もんだい3　（　　　）に なにを いれますか。\n1・2・3・4から いちばん いい ものを ひとつ えらんで ください。", "items": [{ "stem": "わたしの（　　　）は ははの おとうとです。", "choices": ["おばさん", "おにいさん", "おじさん", "おねえさん"], "answer": 3, "explain": "おじさん = uncle; 'my mother's younger brother' is an uncle." }, { "stem": "せんせいは がくせいに えいごを（　　　）。", "choices": ["おしえます", "ならいます", "ききます", "かります"], "answer": 1, "explain": "おしえます = teaches; a teacher teaches students, ならいます is 'learn'." }, { "stem": "ほんを ３（　　　）かいました。", "choices": ["まい", "ほん", "だい", "さつ"], "answer": 4, "explain": "さつ is the counter for books; まい is for flat things, ほん for long things." }, { "stem": "きょうは ２月３日です。あさっては ２月（　　　）です。", "choices": ["よっか", "いつか", "むいか", "ようか"], "answer": 2, "explain": "The day after tomorrow is the 5th = いつか." }, { "stem": "おじいさんは ８０さいですが、とても（　　　）です。", "choices": ["げんき", "しずか", "ひま", "べんり"], "answer": 1, "explain": "げんき = healthy, energetic; fits 'but' after the age." }, { "stem": "ははは まいあさ（　　　）を のみます。", "choices": ["ノート", "ペン", "コーヒー", "カメラ"], "answer": 3, "explain": "コーヒー = coffee; only a drink goes with のみます." }, { "stem": "（　　　）は あめでしたが、きょうは はれです。", "choices": ["あした", "きのう", "あさって", "らいしゅう"], "answer": 2, "explain": "きのう = yesterday; the past tense でした needs a past day." }, { "stem": "ははの りょうりは とても（　　　）です。", "choices": ["ひろい", "くらい", "ながい", "おいしい"], "answer": 4, "explain": "おいしい = delicious; it is the only adjective that describes food." }, { "stem": "いもうとは かぜで きょう がっこうを（　　　）。", "choices": ["かりました", "やすみました", "あそびました", "ならいました"], "answer": 2, "explain": "がっこうを やすみました = was absent from school." }, { "stem": "えいがは ２じかん（　　　）です。", "choices": ["ごろ", "まえ", "ばん", "はん"], "answer": 4, "explain": "２じかんはん = two and a half hours; ごろ means 'around' a clock time." }] }, { "heading": "もんだい4　＿＿＿の ぶんと だいたい おなじ いみの ぶんが あります。\n1・2・3・4から いちばん いい ものを ひとつ えらんで ください。", "items": [{ "stem": "<u>あしたは 日曜日です。</u>", "choices": ["きょうは 金曜日です。", "きょうは 土曜日です。", "きょうは 月曜日です。", "きょうは 火曜日です。"], "answer": 2, "explain": "If tomorrow is Sunday, today is Saturday (土曜日)." }, { "stem": "<u>わたしは １２時３０分に ひるごはんを たべました。</u>", "choices": ["１１時半に ひるごはんを たべました。", "１時半に ひるごはんを たべました。", "１２時半に ひるごはんを たべました。", "１２時１０分に ひるごはんを たべました。"], "answer": 3, "explain": "３０分 = 半 (half past), so 12:30 = １２時半." }, { "stem": "<u>わたしの いえに ともだちが きました。</u>", "choices": ["ともだちは わたしの うちに きました。", "わたしは ともだちの うちに いきました。", "ともだちは がっこうに きました。", "わたしは ともだちと かえりました。"], "answer": 1, "explain": "いえ and うち both mean 'house/home'; the friend came to my home." }] }] }, { "name": "言語知識（文法）・読解", "type": "grammar_reading", "minutes": 50, "parts": [{ "heading": "もんだい1　（　　　）に {何|なに}を いれますか。\n1・2・3・4から いちばん いい ものを {一|ひと}つ {選|えら}んで ください。", "items": [{ "stem": "これ（　　）{私|わたし}の かさです。", "choices": ["を", "は", "に", "で"], "answer": 2, "explain": "は marks the topic: これは わたしの かさです (This is my umbr 。", "items": [{ "stem": "りんごを <u>いつつ</u> かいました。", "choices": ["六つ", "七つ", "五つ", "九つ"], "answer": 3, "explain": "いつつ = 五つ (five things)." }, { "stem": "<u>ろくがつ</u>に 山へ いきます。", "choices": ["六月", "七月", "八月", "九月"], "answer": 1, "explain": "ろくがつ = 六月 (June); 六 = six." }, { "stem": "この かばんは <u>ななせんえん</u>です。", "choices": ["九千円", "七百円", "八千円", "七千円"], "answer": 4, "explain": "ななせんえん = 七千円 (7,000 yen); 千 = thousand; 七百円 would be ななひゃくえん." }, { "stem": "<u>ようか</u>に スーパーへ いきます。", "choices": ["六日", "八日", "九日", "十日"], "answer": 2, "explain": "ようか = 八日 (the 8th)." }, { "stem": "<u>くじ</u>に うちを でます。", "choices": ["八時", "七時", "十時", "九時"], "answer": 4, "explain": "くじ = 九時 (nine o'clock); 九 is irregularly read く in 九時." }, { "stem": "バスは あと <u>じゅっぷん</u>で きます。", "choices": ["千分", "十分", "五分", "六分"], "answer": 2, "explain": "じゅっぷん = 十分 (ten minutes); 十 is ten, 千 is thousand." }, { "stem": "山に ひとが <u>ひゃくにん</u> います。", "choices": ["千人", "十人", "百人", "九人"], "answer": 3, "explain": "ひゃくにん = 百人 (100 people); 百 = hundred." }, { "stem": "<u>すーぱー</u>で かいものを します。", "choices": ["スーパー", "スーバー", "ズーパー", "スーペー"], "answer": 1, "explain": "スーパー (supermarket): ス, long mark, パ with a handakuten (not バ)." }] }, { "heading": "もんだい3　（　　　）に なにを いれますか。\n1・2・3・4から いちばん いい ものを ひとつ えらんで ください。", "items": [{ "stem": "あさごはんに パンと（　　　）を たべました。", "choices": ["くつ", "かさ", "えんぴつ", "たまご"], "answer": 4, "explain": "たまご = egg; the other words are not food." }, { "stem": "レジで おかねを（　　　）。", "choices": ["はらいました", "あけました", "ひきました", "おしました"], "answer": 1, "explain": "おかねを はらう = to pay money." }, { "stem": "この パンは 一つ 百円です。三つ かうと（　　　）円です。", "choices": ["さんひゃく", "さんぴゃく", "さんびゃく", "ろくひゃく"], "answer": 3, "explain": "3 x 100 = 300 = さんびゃく (百 becomes びゃく after 三)." }, { "stem": "えきの ちかくに あるので、かいものに（　　　）です。", "choices": ["ひま", "べんり", "じょうず", "しずか"], "answer": 2, "explain": "べんり = convenient; near the station makes shopping convenient." }, { "stem": "きょうは 八日です。ふつか あとは（　　　）です。", "choices": ["ここのか", "とおか", "なのか", "むいか"], "answer": 2, "explai answer": 2, "explain": "ケーキ = cake; you can make a cake, not a station, shoes or a phone." }, { "stem": "たんじょうびに ははから かばんを（　　　）。", "choices": ["あげました", "かきました", "もらいました", "よびました"], "answer": 3, "explain": "もらう = to receive; ははから (from mother) goes with もらいました, while あげました means giving." }, { "stem": "この スープは とても（　　　）ですから、まだ のめません。", "choices": ["あつい", "ひろい", "ながい", "あかるい"], "answer": 1, "explain": "あつい = hot; hot soup cannot be drunk yet." }, { "stem": "あの えきは ひとが たくさん いて、とても（　　　）です。", "choices": ["しずか", "ひま", "べんり", "にぎやか"], "answer": 4, "explain": "にぎやか = lively, busy; しずか (quiet) contradicts 'many people'." }, { "stem": "あたまが いたいので、（　　　）へ いきます。", "choices": ["えいがかん", "びょういん", "ぎんこう", "こうえん"], "answer": 2, "explain": "びょういん = hospital, where you go when you are sick." }, { "stem": "たんじょうびの パーティーに ともだちが 五（　　　）きました。", "choices": ["ほん", "まい", "にん", "だい"], "answer": 3, "explain": "人 counts people: 五人 = ごにん." }, { "stem": "あしたは ははと（　　　）で ばんごはんを たべます。", "choices": ["レストラン", "ポスト", "ベッド", "ラジオ"], "answer": 1, "explain": "レストラン = restaurant, a place to eat dinner." }, { "stem": "ゆうはんは いつも（　　　）の 六時ごろに たべます。", "choices": ["ごぜん", "あさ", "ひる", "ごご"], "answer": 4, "explain": "ごご = p.m.; dinner is in the evening, so ごぜん/あさ/ひる do not fit." }, { "stem": "あついですから、みずを たくさん（　　　）。", "choices": ["たべました", "のみました", "ききました", "みました"], "answer": 2, "explain": "みず (water) is drunk: のむ." }, { "stem": "ほんを かりに（　　　）へ いきます。", "choices": ["えいがかん", "ゆうびんきょく", "としょかん", "デパート"], "answer": 3, "explain": "としょかん = library, where you borrow books." }] }, { "heading": "もんだい4　＿＿＿の ぶんと だいたい おなじ いみの ぶんが あります。\n1・2・3・4から いちばん いい ものを ひとつ えらんで ください。", "items": [{ "stem": "<u>ゆうびんきょくは えきの ちかくです。</u>", "choices": ["ゆうびんきょくは えきの なかに あります。", "ゆうびんきょくは えきから とおいです。", "ゆうびんきょくは えきから とおく ありません。", "ゆうびんきょくは えきより おおきいです。"], "answer": 3, "explain": "ちかい (near) is the same as とおく ありません (not far)." }, { "stem": "<u>この レストランは やすいです。</u>", "choices": ["この レストランは たかく ありません。", "この レストランは たかいです。", "この レストランは おいしく ありません。", "この レストランは ひろいです。"], "answer": 1, "explain": "やすい (cheap) means たかく ありません (not expensive)." }, { "stem": "<u>あの デパートは ひとが たくさん います。</u>", "choices": ["あの デパートは ひとが すくないです。", "あの デパートは ひとが おおいです。", "あの デパートは あたらしいです。", "あの デパートは とても しずかです。"], "answer": 2, "explain": "たくさん いる = おおい (many people)." }] }] }, { "name": "言語知識（文法）・読解", "type": "grammar_reading", "minutes": 50, "parts": [{ "heading": "もんだい1　（　　　）に なにを いれますか。\n1・2・3・4から いちばん いい ものを ひとつ えらんで ください。", "items": [{ "stem": "{先週|せんしゅう}の {日曜日|にちようび}、{友|とも}だちの {家|うち}で パーティーを（　　　）。", "choices": ["しました", "します", "しません", "して"], "answer": 1, "explain": "先週 (last week) needs the past: します→しました." }, { "stem": "{明日|あした}は {日曜日|にちようび}ですから、{学校|がっこう}へ（　　　）。", "choices": ["{行|い}きませんでした", "{行|い}きました", "{行|い}きません", "{行|い}って"], "answer": 3, "explain": "明日 is future and Sunday is a holiday, so the present negative ～ません is right; ～ませんでした is past." }, { "stem": "{朝|あさ}ごはんを（　　　）、{会社|かいしゃ}へ {行|い}きます。", "choices": ["{食|た}べました", "{食|た}べたい", "{食|た}べない", "{食|た}べて"], "answer": 4, "explain": "The て-form links two actions in order: eat breakfast, then go to work." }, { "stem": "{図書館|としょかん}では {大|おお}きい {声|こえ}で（　　　）。", "choices": ["{話|はな}して ください", "{話|はな}さないで ください", "{話|はな}しましょう", "{話|はな}しませんか"], "answer": 2, "explain": "～ないで ください = please do not ...; the other choices invite speaking loudly, which makes no sense in a library." }, { "stem": "{今日|きょう}は {天気|てんき}が いいですね。{一緒|いっしょ}に {公園|こうえん}へ（　　　）。", "choices": ["{行|い}きませんでした", "{行|い}って います", "{行|い}きませんか", "{行|い}きますから"], "answer": 3, "explain": "～ませんか is the polite invitation 'won't you go with me?'." }, { "stem": "{私|わたし}は {誕生日|たんじょうび}の パーティーで ケーキが（　　　）。", "choices": ["{食|た}べたいです", "{食|た}べます", "{食|た}べました", "{食|た}べて ください"], "answer": 1, "explain": "～たいです = want to ...; the object of たい is marked with が." }, { "stem": "{今|いま}、{何|なに}を して（　　　）か。", "choices": ["あります", "います", "ください", "いきます"], "answer": 2, "explain": "～て います shows an action in progress: 'What are you doing now?'" }, { "stem": "{昨日|きのう}は {雨|あめ}で es": ["せんぜい", "せんせい", "ぜんせい", "せいせん"], "answer": 2, "explain": "先生 = せんせい (teacher)." }, { "stem": "<u>日本語</u>の ほんを かります。", "choices": ["にほんご", "にほんこ", "にぼんご", "にぽんご"], "answer": 1, "explain": "日本語 = にほんご (the Japanese language); 語 = ご." }, { "stem": "この <u>本</u>は おもしろいです。", "choices": ["ぼん", "ぽん", "ほうん", "ほん"], "answer": 4, "explain": "本 = ほん (book)." }, { "stem": "ノートに なまえを <u>書きます</u>。", "choices": ["がきます", "かきます", "かいます", "かぎます"], "answer": 2, "explain": "書きます = かきます (to write)." }, { "stem": "まいばん ほんを <u>読みます</u>。", "choices": ["よびます", "ようみます", "よみます", "ゆみます"], "answer": 3, "explain": "読みます = よみます (to read)." }] }, { "heading": "もんだい2　＿＿＿の ことばは どう かきますか。\n1・2・3・4から いちばん いい ものを ひとつ えらんで ください。", "items": [{ "stem": "おんがくを <u>ききます</u>。", "choices": ["見きます", "言きます", "聞きます", "食きます"], "answer": 3, "explain": "聞きます = ききます (to listen/hear); 聞 has the 耳 (ear) inside the gate." }, { "stem": "ともだちと <u>はなします</u>。", "choices": ["話します", "言します", "聞します", "読します"], "answer": 1, "explain": "話します = はなします (to talk); 話 = はな-." }, { "stem": "「ありがとう」と <u>いいます</u>。", "choices": ["話います", "聞います", "見います", "言います"], "answer": 4, "explain": "言います = いいます (to say)." }, { "stem": "テレビを <u>みます</u>。", "choices": ["聞ます", "見ます", "言ます", "食ます"], "answer": 2, "explain": "見ます = みます (to see, watch)." }, { "stem": "あさ パンを <u>たべます</u>。", "choices": ["飲べます", "買べます", "見べます", "食べます"], "answer": 4, "explain": "食べます = たべます (to eat)." }, { "stem": "コーヒーを <u>のみます</u>。", "choices": ["飲みます", "食みます", "買みます", "見みます"], "answer": 1, "explain": "飲みます = のみます (to drink)." }, { "stem": "ほんやで ほんを <u>かいます</u>。", "choices": ["見います", "言います", "買います", "行います"], "answer": 3, "explain": "買います = かいます (to buy)." }, { "stem": "あした としょかんへ <u>いきます</u>。", "choices": ["言きます", "行きます", "聞きます", "見きます"], "answer": 2, "explain": "行きます = いきます (to go)." }, { "stem": "カフェで <u>こーひー</u>を のみます。", "choices": ["コーピー", "コーヒー", "ユーヒー", "コーヒ"], "answer": 2, "explain": "Coffee is written コーヒー in katakana, with the long-vowel mark ー." }, { "stem": "<u>ばす</u>で えきへ いきます。", "choices": ["バズ", "パス", "ハス", "バス"], "answer": 4, "explain": "Bus is バス; ズ and パ/ハ are different sounds." }] }, { "heading": "もんだい3　（　　　）に なにを いれますか。\n1・2・3・4から いちばん いい ものを ひとつ えらんで ください。", "items": [{ "stem": "げつようびは としょかんが（　　　）です。 はいれません。", "choices": ["へや", "くすり", "やすみ", "じてんしゃ"], "answer": 3, "explain": "やすみ = closed / a day off; the library is closed, so you cannot enter." }, { "stem": "バスていで バスを（　　　）。", "choices": ["あらいます", "あげます", "ひきます", "まちます"], "answer": 4, "explain": "まちます = to wait; you wait for a bus at a bus stop." }, { "stem": "この カフェは ひとが おおくて、とても（　　　）です。", "choices": ["うるさい", "わかい", "ほそい", "かるい"], "answer": 1, "explain": "うるさい = noisy; a crowded cafe is noisy." }, { "stem": "この えきは（　　　）ですから、バスも でんしゃも あります。", "choices": ["べんり", "ひま", "じょうず", "すき"], "answer": 1, "explain": "べんり = convenient; having both bus and train makes a station convenient." }, { "stem": "カフェの（　　　）で ともだちと はなしました。", "choices": ["ポスト", "ネクタイ", "テーブル", "プール"], "answer": 3, "explain": "テーブル = table; you sit at a table in a cafe." }, { "stem": "えきで きっぷを 二（　　　）かいました。", "choices": ["ほん", "まい", "ひき", "だい"], "answer": 2, "explain": "まい is the counter for flat things such as tickets (二まい = two tickets)." }, { "stem": "（　　　）の ばん、ホテルに ついて、すぐに ねました。", "choices": ["あした", "らいげつ", "あさって", "きのう"], "answer": 4, "explain": "きのう = yesterday; the verbs are past tense, so a past time word is needed." }, { "stem": "くうこうまで バスで 一じかん（　　　）。", "choices": ["かかります", "あります", "います", "もちます"], "answer": 1, "explain": "かかります = to take (time); 一じかん かかります = it takes one hour." }, { "stem": "でんしゃに（　　　）、ほんを よみました。", "choices": ["のって", "おりて", "おして", "まがって"], "answer": 1, "explain": "のって = the te-form of のります (to get on); you board a train with 〜に のる." }, { "stem": "この まちには おおきい（　　　）が あります。 ほんが たくさん あります。", "choices": ["ぎんこう", "としょかん", "びょういん", "レストラン"], "answer": 2, "explain": "としょかん = library; it is the place with lots of books." }] }, { "heading": "もんだい4　＿＿＿の ぶんと だいたい おなじ いみの ぶんが あります。\n1・2・3・4から いちばん : ["少なかった", "少くなかった", "小なかった", "多なかった"], "answer": 1, "explain": "少ない (すくない) = few; the okurigana is 少ない, so past is 少なかった." }, { "stem": "<u>しろい</u> シャツを かいました。", "choices": ["古い", "白い", "日い", "少い"], "answer": 2, "explain": "白い = しろい (white)." }, { "stem": "なつやすみに ともだちと <u>やま</u>へ いきました。", "choices": ["山", "川", "火", "水"], "answer": 1, "explain": "山 = やま (mountain). 川 is かわ, 火 is ひ." }, { "stem": "<u>かわ</u>で さかなを みました。", "choices": ["山", "川", "水", "火"], "answer": 2, "explain": "川 = かわ (river). 山 is やま, 水 is みず." }, { "stem": "きょうは いい <u>てんき</u>ですね。", "choices": ["大気", "天木", "火気", "天気"], "answer": 4, "explain": "天気 = てんき (weather)." }, { "stem": "なつやすみに <u>ホテル</u>に とまりました。", "choices": ["ボテル", "ポテル", "ホチル", "ホテル"], "answer": 4, "explain": "ホテル = hotel; watch the dakuten (ホ not ボ/ポ) and テ vs チ." }, { "stem": "あさ <u>シャワー</u>を あびます。", "choices": ["ツャワー", "シヤワー", "シャワー", "ンャワー"], "answer": 3, "explain": "シャワー = shower; small ャ and シ (not ツ/ン)." }] }, { "heading": "もんだい3　（　　　）に なにを いれますか。\n1・2・3・4から いちばん いい ものを ひとつ えらんで ください。", "items": [{ "stem": "あした テストが ありますから、うちで（　　　）を します。", "choices": ["べんきょう", "さんぽ", "せんたく", "りょこう"], "answer": 1, "explain": "べんきょう = study; the test tomorrow is the clue." }, { "stem": "ほんを かりる ときは、（　　　）へ いきます。", "choices": ["ぎんこう", "としょかん", "びょういん", "ゆうびんきょく"], "answer": 2, "explain": "としょかん = library, where you borrow books." }, { "stem": "わからない ことばは せんせいに（　　　）。", "choices": ["ききます", "あびます", "かえります", "はいります"], "answer": 1, "explain": "ききます = ask (聞く); you ask a teacher about a word you do not know." }, { "stem": "この もんだいは（　　　）ですから、せんせいに ききます。", "choices": ["おいしい", "やさしい", "あまい", "むずかしい"], "answer": 4, "explain": "むずかしい = difficult; that is why you ask the teacher. やさしい = easy." }, { "stem": "かぜを ひいたので、（　　　）を のみます。", "choices": ["せっけん", "ぼうし", "さいふ", "くすり"], "answer": 4, "explain": "くすり = medicine, the only thing here you can のみます." }, { "stem": "ごはんの あとで、（　　　）を みがきます。", "choices": ["みみ", "おなか", "は", "かた"], "answer": 3, "explain": "は = tooth (歯); は  {前|まえ}に {自転車|じてんしゃ}が {四|よん}（　　　）あります。", "choices": ["まい", "さつ", "ひき", "だい"], "answer": 4, "explain": "だい (台) counts vehicles and machines; ひき is for small animals." }, { "stem": "トイレは {二|に}（　　　）に あります。{階段|かいだん}の {右|みぎ}です。", "choices": ["かい", "こ", "さつ", "にん"], "answer": 1, "explain": "かい (階) counts floors: にかい = the second floor." }, { "stem": "ここに じしょが あります。（　　　）は {私|わたし}のです。", "choices": ["これ", "どれ", "あそこ", "ここ"], "answer": 1, "explain": "これ = this one (near the speaker); どれ is a question word and あそこ/ここ are places." }, { "stem": "（　　　）{本|ほん}が {好|す}きですか。", "choices": ["どこ", "どれ", "だれ", "どんな"], "answer": 4, "explain": "どんな + noun asks what kind of; どこ/どれ/だれ cannot directly modify 本." }, { "stem": "{駅|えき}まで バス（　　　）{行|い}きます。", "choices": ["を", "で", "が", "と"], "answer": 2, "explain": "で marks the means of transport: バスで = by bus." }, { "stem": "{私|わたし}は {本|ほん}が {好|す}きです。（　　　）、{時間|じかん}が ありません。", "choices": ["だから", "そして", "でも", "それから"], "answer": 3, "explain": "でも = but; liking books contrasts with having no time. だから would mean 'so'." }, { "stem": "けさは {頭|あたま}が {痛|いた}いです。（　　　）、{学校|がっこう}を {休|やす}みます。", "choices": ["でも", "だから", "それとも", "どうして"], "answer": 2, "explain": "だから = therefore; the headache is the reason for staying home." }, { "stem": "{先生|せんせい}は いま {本|ほん}を {読|よ}んで（　　　）。", "choices": ["あります", "ください", "います", "ません"], "answer": 3, "explain": "〜て います expresses an action in progress; 読んで います = is reading." }, { "stem": "{日本語|にほんご}は {難|むずか}しいです（　　　）、おもしろいです。", "choices": ["から", "が", "を", "に"], "answer": 2, "explain": "が joins two clauses in contrast: difficult, but interesting. から would give a reason." }, { "stem": "{夏休|なつやす}みの {旅行|りょこう}は {八月|はちがつ}（　　　）から です。", "choices": ["よっか", "よんにち", "しにち", "よか"], "answer": 1, "explain": "The 4th of the month is よっか; days of the month are irregular." }, { "stem": "{私|わたし}は {毎日|まいにち} {九時|くじ}から {四時|よじ}（　　　）{学校|がっこう}に います。", "choices": ["まで", "に", "で", "を"], "answer": 1, "explain": "〜から 〜まで = from … until …; 四時まで marks the end point." ": "<u>せんげつ</u> アルバイトを はじめました。", "choices": ["先月", "今月", "来月", "毎月"], "answer": 1, "explain": "先月 = せんげつ (last month)." }, { "stem": "きょうしつに がくせいが <u>ふたり</u> います。", "choices": ["一人", "三人", "四人", "二人"], "answer": 4, "explain": "二人 = ふたり (two people)." }, { "stem": "おにぎりを <u>よっつ</u> かいました。", "choices": ["三つ", "二つ", "一つ", "四つ"], "answer": 4, "explain": "四つ = よっつ (four things)." }, { "stem": "デパートの <u>れじ</u>で おかねを はらいます。", "choices": ["レシ", "ルジ", "レジ", "ノジ"], "answer": 3, "explain": "レジ = cash register; シ/ジ and レ/ノ are look-alikes." }, { "stem": "<u>えれべーたー</u>で ５かいへ いきます。", "choices": ["エレペーター", "エルベーター", "エレベーター", "エレバーター"], "answer": 3, "explain": "エレベーター = elevator." }] }, { "heading": "もんだい3　（　　　）に なにを いれますか。\n1・2・3・4から いちばん いい ものを ひとつ えらんで ください。", "items": [{ "stem": "デパートで 新しい くつを（　　　）。", "choices": ["うりました", "かいました", "つくりました", "かけました"], "answer": 2, "explain": "かいました = bought; うりました (sold) does not fit a customer." }, { "stem": "きのう おそくまで アルバイトでしたから、きょうは とても（　　　）です。", "choices": ["かるい", "ねむい", "とおい", "うすい"], "answer": 2, "explain": "ねむい = sleepy; the other adjectives do not describe a person's condition." }, { "stem": "この デパートは ひとが おおくて、いつも（　　　）です。", "choices": ["にぎやか", "しずか", "ひま", "べんり"], "answer": 1, "explain": "にぎやか = lively, bustling; opposite of しずか." }, { "stem": "ともだちに ペンを ２（　　　）あげました。", "choices": ["ほん", "まい", "さつ", "だい"], "answer": 1, "explain": "Long thin things such as pens are counted with ほん." }, { "stem": "レジの ひとは あかい（　　　）を きて います。", "choices": ["カメラ", "ラジオ", "シャツ", "テープ"], "answer": 3, "explain": "シャツ = shirt; you can wear a shirt but not a camera or radio." }, { "stem": "アルバイトで あたらしい しごとを（　　　）。", "choices": ["わすれます", "おくります", "たちます", "おぼえます"], "answer": 4, "explain": "おぼえます = learn/memorize; しごとを わすれます does not fit a new job." }, { "stem": "デパートは まいしゅう すいようびが（　　　）です。", "choices": ["ゆうめい", "へた", "やすみ", "こまる"], "answer": 3, "explain": "やすみ = a day off / closed; the others are not nouns that fit." }, { "stem": "この レストランは ねだんが（　　　）、いつも ひとが おおいです。", " 。" }] }, { "heading": "もんだい4　（ぶんを きいて、1から3の なかから いちばん いい ものを えらんで ください。）", "items": [{ "stem": "", "choices": ["６がつ ８かです。", "８じに おきます。", "６にんです。"], "answer": 1, "explain": "いつ asks for a date.", "visible_choices": false, "script": "たんじょうびは いつですか。\n1 ６がつ ８かです。\n2 ８じに おきます。\n3 ６にんです。" }, { "stem": "", "choices": ["ケーキやへ いきます。", "あまくて おいしかったです。", "はい、たべました。"], "answer": 2, "explain": "どうでしたか asks for an impression.", "visible_choices": false, "script": "ケーキは どうでしたか。\n1 ケーキやへ いきます。\n2 あまくて おいしかったです。\n3 はい、たべました。" }, { "stem": "", "choices": ["いいえ、かえしません。", "としょかんです。", "あした かえします。"], "answer": 3, "explain": "いつ asks for a time.", "visible_choices": false, "script": "この ほんは いつ かえしますか。\n1 いいえ、かえしません。\n2 としょかんです。\n3 あした かえします。" }, { "stem": "", "choices": ["はい、てつだいました。", "いいえ、どうも。", "ええ、いいですよ。"], "answer": 3, "explain": "A request is accepted with ええ、いいですよ.", "visible_choices": false, "script": "ちょっと てつだって くれませんか。\n1 はい、てつだいました。\n2 いいえ、どうも。\n3 ええ、いいですよ。" }, { "stem": "", "choices": ["３にんでした。", "ゆみさんと たなかさんです。", "６じからです。"], "answer": 2, "explain": "だれ asks who.", "visible_choices": false, "script": "パーティーに だれが きましたか。\n1 ３にんでした。\n2 ゆみさんと たなかさんです。\n3 ６じからです。" }, { "stem": "", "choices": ["いいえ、おもしろく ありました。", "いいえ、あまり おもしろくないです。", "はい、おもしろいでした。"], "answer": 2, "explain": "Correct い-adjective forms: おもしろくないです.", "visible_choices": false, "script": "この ほんは おもしろいですか。\n1 いいえ、おもしろく ありました。\n2 いいえ、あまり おもしろくないです。\n3 はい、おもしろいでした。" }] }] }] }, { "id": "mock12", "title": "JLPT N5 Mock Paper 12", "kind": "mock", "subtitle": "Original practice paper (not an official JLPT exam)", "filename": "N5_Mock_Paper_12", "sections": [{ "name": "言語知識（文字・語彙）", "type": "vocab", "minutes": 25, "parts": [{ "heading": "もんだい1　＿＿＿の ことばは どう よみますか。\n1・2・3・4から いちばん いい ものを ひとつ えらんで ください。", "items": [{ "stem": "あの <u>女</u>の ひとは だれですか。", "choices": ["おなな", "おんあ", "おんだ", "おんな"], "answer": 4, "explain": "女 = おんな (woman)." }, { "stem": "この レストランには <u>子ども</u>の いすが あります。", "choices": ["ことも", "ごども", "こども", "こどむ"], "answer": 3, "explain": "子ども = こども (child)." }, { "stem": "<u>友だち</u>と レストランへ いきます。", "choices": ["とむだち", "ともだち", "どもだち", "ともたち"], "answer": 2, "explain": "友だち = ともだち (friend)." }, { "stem": "<u>父</u>は りょこうが すきです。", "choices": ["ちぢ", "じち", "ちっち", "ちち"], "answer": 4, "explain": "父 = ちち (my father)." }, { "stem": "<u>母</u>は うみが すきです。", "choices": ["ばば", "ほほ", "はあ", "はは"], "answer": 4, "explain": "母 = はは (my mother)." }, { "stem": "この ホテルには <u>学生</u>が おおいです。", "choices": ["がくぜい", "かくせい", "がくせい", "がっせい"], "answer": 3, "explain": "学生 = がくせい (student)." }, { "stem": "<u>学校</u>は あした やすみです。", "choices": ["がこう", "がっこう", "がくこう", "かっこう"], "answer": 2, "explain": "学校 = がっこう (school); the small っ is required." }, { "stem": "<u>先生</u>は レストランで ごはんを たべました。", "choices": ["せんせえ", "せんせい", "ぜんせい", "せんぜい"], "answer": 2, "explain": "先生 = せんせい (teacher)." }, { "stem": "<u>日本語</u>で メニューを よみます。", "choices": ["にほんこ", "にぽんご", "にほんご", "にほんが"], "answer": 3, "explain": "日本語 = にほんご (Japanese language)." }, { "stem": "つくえの うえに <u>本</u>が あります。", "choices": ["ほん", "ぼん", "ぽん", "ほうん"], "answer": 1, "explain": "本 = ほん (book)." }, { "stem": "ここに なまえを <u>書いて</u> ください。", "choices": ["かいて", "かって", "かきて", "かんて"], "answer": 1, "explain": "書く → 書いて (write); read かいて." }, { "stem": "メニューを <u>読みます</u>。", "choices": ["よります", "よびます", "よいます", "よみます"], "answer": 4, "explain": "読む = to read; 読みます = よみます." }] }, { "heading": "もんだい2　＿＿＿の ことばは どう かきますか。\n1・2・3・4から いちばん いい ものを ひとつ えらんで ください。", "items": [{ "stem": "あした ともだちに <u>きき</u>ます。", "choices": ["言き", "聞き", "話き", "見き"], "answer": 2, "explain": "聞く = to ask / listen; きき = 聞き." }, { "stem": "メニューを <u>みて</u> ください。", "choices": ["食て", "行て", "休て", "見て"], "answer": 4, "explain": "見る = to look; みて = 見て." }, { "stem": "レストランで ひるごはんを <u>たべ</u>ます。", "choices": ["飲べ", "食べ", "買べ", "休べ"], "answer": 2, "explain": "食べる = to eat; たべ = 食べ." }, { "stem": "おちゃを <u>のみ</u>ます。", "choices": ["飲み", "食み", "買み", "見み"], "answer": 1, "explain": "飲む = to drink; のみ = 飲み." }, { "stem": "おみやげを <u>かい</u> ain": "みみ (mimi) = ear; you listen with your ears." }, { "stem": "ふゆは（　　　）ですから、コートを きます。", "choices": ["あつい", "あかるい", "うるさい", "さむい"], "answer": 4, "explain": "さむい (samui) = cold; you wear a coat in the cold winter." }, { "stem": "かぜを（　　　）ので、がっこうを やすみました。", "choices": ["かけた", "ぬいだ", "ひいた", "けした"], "answer": 3, "explain": "ひいた (hiita) = caught; かぜを ひく = catch a cold." }, { "stem": "おじいさんは びょうきでしたが、いまは（　　　）です。", "choices": ["ひま", "しずか", "げんき", "にぎやか"], "answer": 3, "explain": "げんき (genki) = healthy, well; contrasts with びょうき." }, { "stem": "あさ おきて、（　　　）を みがきます。", "choices": ["みみ", "は", "め", "あたま"], "answer": 2, "explain": "は (ha) = teeth; は を みがく = brush teeth." }, { "stem": "あついので、うわぎを（　　　）。", "choices": ["きます", "ぬぎます", "はきます", "かけます"], "answer": 2, "explain": "ぬぎます (nugimasu) = take off clothes; it is hot." }, { "stem": "あたらしい くつを（　　　）でかけました。", "choices": ["はいて", "きて", "かけて", "かぶって"], "answer": 1, "explain": "はいて (haite) = wearing (on the feet); くつを はく." }, { "stem": "この ネクタイは 10万円です。とても（　　　）です。", "choices": ["やすい", "あかるい", "ちかい", "たかい"], "answer": 4, "explain": "たかい (takai) = expensive; 100,000 yen for a tie." }, { "stem": "へやが きたないので、（　　　）を します。", "choices": ["さんぽ", "しょくじ", "けっこん", "そうじ"], "answer": 4, "explain": "そうじ (souji) = cleaning; he cleans because the room is dirty." }, { "stem": "あつい 日は（　　　）を つけます。", "choices": ["エアコン", "ナイフ", "ノート", "テスト"], "answer": 1, "explain": "エアコン (eakon) = air conditioner; you turn it on (つける) on hot days." }, { "stem": "（　　　）に のって 5かいへ いきます。", "choices": ["エレベーター", "ストーブ", "カメラ", "テーブル"], "answer": 1, "explain": "エレベーター (erebeetaa) = elevator; you ride it to the 5th floor." }] }, { "heading": "もんだい4　＿＿＿の ぶんと だいたい おなじ いみの ぶんが あります。\n1・2・3・4から いちばん いい ものを ひとつ えらんで ください。", "items": [{ "stem": "<u>あしたは やすみです。</u>", "choices": ["あしたは しごとが あります。", "あしたは あめです。", "あしたは しごとが ありません。", "きのうは やすみでした。"], "answer": 3, "explain": "やすみ (holiday) means no work; the others change the day or the topic." }, { "stem": "<u>この ほんは おもしろくないです。</u>", "choices": ["この ほんは おもしろいです。", "この ほんは むずかしいです。", "この ほんは ふるいです。", "この ほんは つまらないです。"], "answer": 4, "explain": "おもしろくない = つまらない (tsumaranai), boring." }, { "stem": "<u>この みせは やすいです。</u>", "choices": ["この みせは ものが たかいです。", "この みせは ものが たかくないです。", "この みせは ものが おいしくないです。", "この みせは ものが すくないです。"], "answer": 2, "explain": "やすい (cheap) = not expensive." }, { "stem": "<u>この かんじを よむ ことが できません。</u>", "choices": ["この かんじは かんたんです。", "この かんじを かきました。", "この かんじが すきです。", "この かんじの よみかたが わかりません。"], "answer": 4, "explain": "Not being able to read it = not knowing the reading (よみかた)." }, { "stem": "<u>きょうは あめが ふっています。</u>", "choices": ["きょうは てんきが いいです。", "きょうは はれです。", "きょうは てんきが わるいです。", "きょうは あついです。"], "answer": 3, "explain": "Rain means bad weather (てんきが わるい)." }, { "stem": "<u>あの 人は わたしの ははの あにです。</u>", "choices": ["あの 人は わたしの おじさんです。", "あの 人は わたしの おばさんです。", "あの 人は わたしの おじいさんです。", "あの 人は わたしの おとうとです。"], "answer": 1, "explain": "ははの あに = mother's older brother = おじさん (uncle)." }, { "stem": "<u>ここに ごみを すてないで ください。</u>", "choices": ["ここは ごみを すてては いけません。", "ここは ごみを すてても いいです。", "ここに ごみを すてて ください。", "ここは ごみを すてなくても いいです。"], "answer": 1, "explain": "〜ないで ください = 〜ては いけません (do not)." }, { "stem": "<u>この いすは ふるいです。</u>", "choices": ["この いすは あたらしいです。", "この いすは あたらしくないです。", "この いすは おおきくないです。", "この いすは たかくないです。"], "answer": 2, "explain": "ふるい (old) = not new." }, { "stem": "<u>わたしは 毎日 えいがを みます。</u>", "choices": ["わたしは ときどき えいがを みます。", "わたしは ぜんぜん えいがを みません。", "わたしは いつも えいがを みます。", "わたしは あまり えいがを みません。"], "answer": 3, "explain": "毎日 (every day) = いつも (always)." }, { "stem": "<u>この カメラは ちちに もらいました。</u>", "choices": ["ちちに この カメラを あげました。", "ちちが この カメラを くれました。", "ちちが この カメラを かいました。", "ちちに この カメラを かえしました。"], "answer": 2, "explain": "もらう (receive) matches the giver doing くれる." }, { "stem": "<u>ゆうびんきょくは ぎんこうの となりです。</u>", "choices": ["ぎんこうの まえに ゆうびんきょくが あります。", "ぎんこうの となりに ゆうびんきょくが あります。", "ぎんこうの なかに ゆうびんきょくが あります。", "ぎんこうの うしろに ゆうびんきょくが あります。"], "answer": 2, "explain": "となり (next to) stays the same; the others xplain": "ニュース (nyuusu) = news; small ュ, ー, and ス (not ヌ)." }, { "stem": "<u>ひゃく</u>えんの ノートです。", "choices": ["白", "百", "日", "千"], "answer": 2, "explain": "百 (hyaku) = hundred; 百 vs 白 (shiro, white)." }, { "stem": "<u>くらす</u>は 10にんです。", "choices": ["クラス", "ケラス", "クラヌ", "グラス"], "answer": 1, "explain": "クラス (kurasu) = class; ク vs ケ, ス vs ヌ; グラス (glass) is read ぐらす." }, { "stem": "<u>ぎたー</u>を ひきます。", "choices": ["ギタ一", "ギクー", "キター", "ギター"], "answer": 4, "explain": "ギター (gitaa) = guitar; ギ has dakuten, タ vs ク, and ー is not 一." }, { "stem": "<u>ぽすと</u>に てがみを いれます。", "choices": ["ポスト", "ボスト", "ポヌト", "ポスド"], "answer": 1, "explain": "ポスト (posuto) = mailbox; ポ has handakuten, ス vs ヌ, ト has no dakuten." }, { "stem": "この <u>ほん</u>は おもしろいです。", "choices": ["木", "水", "休", "本"], "answer": 4, "explain": "本 (hon) = book; 本 vs 木 (ki, tree) differ by one stroke." }, { "stem": "<u>ないふ</u>で にくを きります。", "choices": ["ナイワ", "ナイウ", "ナイフ", "ナィフ"], "answer": 3, "explain": "ナイフ (naifu) = knife; フ vs ワ/ウ, and the イ is full-size." }, { "stem": "<u>れすとらん</u>で ごはんを たべます。", "choices": ["レストラソ", "レヌトラン", "レストラン", "レスドラン"], "answer": 3, "explain": "レストラン (resutoran) = restaurant; ン vs ソ, ス vs ヌ, and ト has no dakuten." }, { "stem": "ともだちと <u>ぱーてぃー</u>を します。", "choices": ["パーテイー", "パーティー", "バーティー", "パーティ一"], "answer": 2, "explain": "パーティー (paatii) = party; small ィ, ー vs 一, and パ has handakuten." }] }, { "heading": "反対ことば　はんたいの いみの ことばを えらんで ください。\n1・2・3・4から いちばん いい ものを ひとつ えらんで ください。", "items": [{ "stem": "「あつい」の はんたいは なんですか。", "choices": ["かるい", "さむい", "ひろい", "あかるい"], "answer": 2, "explain": "あつい (hot) is opposite to さむい (samui, cold)." }, { "stem": "「おおい」の はんたいは なんですか。", "choices": ["すくない", "ながい", "ふるい", "ちかい"], "answer": 1, "explain": "おおい (many) is opposite to すくない (sukunai, few)." }, { "stem": "「ふるい」の はんたいは なんですか。", "choices": ["おもい", "ちかい", "ほそい", "あたらしい"], "answer": 4, "explain": "ふるい (old) is opposite to あたらしい (atarashii, new)." }, { "stem": "「たかい」の はんたいは なんですか。", "choices": ["やすい", "かるい", "くらい" function fmt(s){
  s=String(s||'').replace(/<u>/g,'\u0001U').replace(/<\/u>/g,'\u0001E');
  s=esc(s).replace(/\u0001U/g,'<u>').replace(/\u0001E/g,'</u>');
  s=s.replace(/\{([^{}|]+)\|([^{}|]+)\}/g,'<ruby>$1<rt>$2</rt></ruby>');
  s=s.replace(/\[★\]/g,'<span class="blank">★</span>').replace(/\[__\]/g,'<span class="blank"></span>');
  return s;
}

    const ready=!!p.sections;
    if(!ready) return `<div class="card pending"><b>${esc(p.title)}</b><small>Coming next</small></div>`;
    const n=p.sections.reduce((a,s)=>a+s.parts.reduce((b,q)=>b+q.items.length,0),0);
    const best=store.get('best-'+p.id);
    return `<a class="card" href="#${p.id}"><b>${esc(p.title.replace('JLPT N5 ',''))}</b><small>${n} questions${best!=null?` · best ${best}%`:''}</small></a>`;
  };
  app.innerHTML=`<h2>Choose a paper</h2>
  <p class="sub">${done.length} of 20 ready. Each mock paper has vocabulary and kanji, grammar and reading, and listening, with answers and explanations. Pick answers, press <b>Check answers</b>, and read the explanations. For listening, press the play button to hear the script read aloud in Japanese (needs a Japanese voice on your device).</p>
  <h2 style="font-size:18px">Mock papers</h2><div class="grid">${mocks.map(card).join('')}</div>
  <h2 style="font-size:18px">Topic drills</h2><div class="grid">${drills.map(card).join('')}</div>
  <p class="note">Questions are original practice material written at JLPT N5 level, not taken from official exams. Scoring is a practice guide only.</p>`;
}
function speak(script,btn){
  if(!('speechSynthesis' in window)){
    showScriptInline(btn,script); return;
  }
  const synth=speechSynthesis; synth.cancel();
  function trySpeak(jaVoices){
    const lines=script.split('\n').map(l=>l.trim()).filter(Boolean);
    const queue=[];
    for(let r=0;r<2;r++){ lines.forEach(l=>{
      let pitch=1,t=l;
      if(/^男[：:]/.test(l)){pitch=0.8;t=l.replace(/^男[：:]/,'')}
      else if(/^女[：:]/.test(l)){pitch=1.25;t=l.replace(/^女[：:]/,'')}
      t=t.replace(/^しつもん[：:]/,'');
      const u=new SpeechSynthesisUtterance(t);
      u.lang='ja-JP'; u.rate=0.85; u.pitch=pitch;
      if(jaVoices&&jaVoices[0]) u.voice=jaVoices[0];
      queue.push(u)});
      const gap=new SpeechSynthesisUtterance('。'); gap.lang='ja-JP'; gap.volume=0; queue.push(gap);
    }
    let started=false;
    queue[0].onstart=()=>{started=true};
    queue[0].onerror=(e)=>{if(!started||e.error==='not-allowed')showScriptInline(btn,script)};
    queue.forEach(u=>synth.speak(u));
    setTimeout(()=>{if(!started&&!synth.speaking){showScriptInline(btn,script)}},1500);
  }
  function resolveVoices(attempt){
    const all=synth.getVoices();
    const ja=all.filter(v=>/^ja/i.test(v.lang));
    if(ja.length){trySpeak(ja); return}
    if(attempt<10){setTimeout(()=>resolveVoices(attempt+1),200); return}
    trySpeak(null);
  }
  resolveVoices(0);
}
function showScriptInline(btn,script){
  const wrap=btn.closest('.play');
  if(!wrap||wrap.querySelector('.inline-script'))return;
  const d=document.createElement('details');
  d.className='inline-script';
  d.style.cssText='margin-top:6px;font-size:13px;color:var(--mute)';
  d.innerHTML='<summary style="cursor:pointer;color:var(--accent)">📄 Show script (audio unavailable)</summary>'
    +'<div style="white-space:pre-line;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 10px;margin-top:4px">'+script.replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</div>';
  wrap.appendChild(d); d.open=true;
}
function paper(id){
  const p=DATA.papers.find(x=>x.id===id); if(!p){home();return}
  const app=$('#app'); const key='ans-'+id;
  let ans=store.get(key)||{}; let checked=false;
  let html=`<p><a href="#">← All papers</a></p><h2>${esc(p.title)}</h2><div class="sub">${fmt(p.subtitle||'')}</div>
  <p class="note">${p.kind==='mock'?'Work through the sections in order. Suggested times are shown. For listening, press ▶ to hear each item (played twice) before choosing.':'Work without checking, then press Check answers.'}</p>`;
  p.sections.forEach((s,si)=>{
    html+=`<div class="sec"><h3><span>${esc(s.name)}</span><span class="t">${s.minutes||''} min <button data-timer="${s.minutes||0}" class="tm">Start timer</button> <span class="timer"></span></span></h3>`;
    if(s.instructions) html+=`<div class="note">${fmt(s.instructions)}</div>`;
    s.parts.forEach((pt,pi)=>{
      html+=`<div class="head">${fmt(pt.heading)}</div>`;
      if(pt.note) html+=`<div class="note">${fmt(pt.note)}</div>`;
      if(pt.passage) html+=`<div class="passage">${fmt(pt.passage).replace(/\n/g,'<br>')}</div>`;
      if(pt.table){const t=pt.table;html+=`<div class="passage" style="text-align:center">${t.title?`<b>${fmt(t.title)}</b>`:''}<table class="info">${t.rows.map((r,ri)=>'<tr>'+r.map(c=>`<${ri?'td':'th'}>${fmt(c)}</${ri?'td':'th'}>`).join('')+'</tr>').join('')}</table></div>`}
      pt.items.forEach((it,ii)=>{
        const id=`${si}-${pi}-${ii}`; const hidden=s.type==='listening'&&it.visible_choices===false;
        const wide=Math.max(...it.choices.map(c=>plain(c).length))>16;
        html+=`<div class="item" data-id="${id}" data-ans="${it.answer}"><div class="stem"><span class="num">${ii+1}</span><span>${fmt(it.stem||'')}</span></div>`;
        if(s.type==='listening'&&it.script) html+=`<div class="play"><button class="pl" data-s="${si}-${pi}-${ii}">▶ Play</button></div>`;
        html+=`<div class="opts ${wide?'wide':''}">${it.choices.map((c,ci)=>`<button class="opt" data-c="${ci+1}"><span class="n">${ci+1}</span>${hidden?'(spoken)':fmt(c)}</button>`).join('')}</div>`;
        html+=`<div class="fb"></div></div>`;
      });
    });
    html+='</div>';
  });
  html+=`<div class="score"><div class="s" id="sc">Answered 0 / 0</div><button id="chk" class="primary">Check answers</button><button id="rev">Show all answers</button><button id="rst">Reset</button></div>`;
  app.innerHTML=html;
  const items=[...app.querySelectorAll('.item')];
  const total=items.length;
  function getItem(id){const [a,b,c]=id.split('-').map(Number);return p.sections[a].parts[b].items[c]}
  function secOf(id){return p.sections[Number(id.split('-')[0])]}
  function refresh(){
    items.forEach(el=>{const a=ans[el.dataset.id];el.querySelectorAll('.opt').forEach(b=>b.classList.toggle('sel',!checked&&Number(b.dataset.c)===a))});
    if(!checked)$('#sc').textContent=`Answered ${Object.keys(ans).length} / ${total}`;
  }
  items.forEach(el=>el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(checked)return;ans[el.dataset.id]=Number(b.dataset.c);store.set(key,ans);refresh()}));
  app.querySelectorAll('.pl').forEach(b=>b.onclick=()=>speak(getItem(b.dataset.s).script,b));
  function showFb(el,mode){
    const it=getItem(el.dataset.id), a=ans[el.dataset.id], right=it.answer;
    el.querySelectorAll('.opt').forEach(b=>{const c=Number(b.dataset.c);b.classList.remove('sel','right','wrong');if(c===right)b.classList.add('right');else if(c===a&&mode==='check')b.classList.add('wrong')});
    if(mode==='check'){el.classList.toggle('ok',a===right);el.classList.toggle('bad',a!==right)}
    let seq='';if(it.order)seq=`<br>Correct order: ${it.order.map(k=>fmt(it.choices[k-1])).join(' → ')}`;
    let sc='';if(it.script)sc=`<div class="script"><b>Script</b>\n${esc(it.script)}</div>`;
    el.querySelector('.fb').innerHTML=`<div class="exp"><span class="ans">Answer: ${right}</span>${a&&mode==='check'&&a!==right?` (you chose ${a})`:''}${seq}<br>${fmt(it.explain)}</div>${sc}`;
  }
  $('#chk').onclick=()=>{
    checked=true;const per={};let ok=0;
    items.forEach(el=>{showFb(el,'check');const s=secOf(el.dataset.id).name;per[s]=per[s]||[0,0];per[s][1]++;if(ans[el.dataset.id]===Number(el.dataset.ans)){ok++;per[s][0]++}});
    const pct=Math.round(ok/total*100);const best=store.get('best-'+id);if(best==null||pct>best)store.set('best-'+id,pct);
    $('#sc').innerHTML=`<b>Score ${ok} / ${total} (${pct}%)</b><br>`+Object.entries(per).map(([k,v])=>`${esc(k)}: ${v[0]}/${v[1]}`).join(' · ');
  };
  $('#rev').onclick=()=>{checked=false;items.forEach(el=>showFb(el,'reveal'))};
  $('#rst').onclick=()=>{if(!confirm('Clear all your answers for this paper?'))return;ans={};store.set(key,ans);checked=false;items.forEach(el=>{el.className='item';el.querySelector('.fb').innerHTML='';el.querySelectorAll('.opt').forEach(b=>b.classList.remove('right','wrong','sel'))});refresh();window.scrollTo(0,0)};
  app.querySelectorAll('.tm').forEach(b=>b.onclick=()=>{
    const mins=Number(b.dataset.timer);if(!mins)return;const out=b.parentElement.querySelector('.timer');
    if(b._iv){clearInterval(b._iv);b._iv=null;b.textContent='Start timer';out.textContent='';return}
    let left=mins*60;b.textContent='Stop';
    b._iv=setInterval(()=>{left--;out.textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0');if(left<=0){clearInterval(b._iv);b._iv=null;b.textContent='Start timer';out.textContent='Time up'}},1000);
  });
  refresh();window.scrollTo(0,0);
}
function route(){const h=location.hash.slice(1);if(h)paper(h);else home();}
window.addEventListener('hashchange',route);
$('#furi').onclick=function(){document.body.classList.toggle('nofuri');this.textContent='Furigana: '+(document.body.classList.contains('nofuri')?'off':'on')};
$('#theme').onclick=()=>{const r=document.documentElement;const dark=r.dataset.theme==='dark'||(!r.dataset.theme&&matchMedia('(prefers-color-scheme:dark)').matches);r.dataset.theme=dark?'light':'dark'};
if('speechSynthesis' in window)speechSynthesis.getVoices();
route();
</script></body></html>
